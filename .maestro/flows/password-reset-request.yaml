appId: app.perched
---
- launchApp:
    clearState: true
- assertVisible:
    id: signin-screen
- tapOn:
    id: signin-reset-password-button
- assertVisible:
    id: reset-screen
- tapOn:
    id: reset-email-input
- inputText: ${E2E_RESET_EMAIL}
- hideKeyboard
- tapOn:
    id: reset-submit-button
- extendedWaitUntil:
    visible:
      id: reset-status-message
    timeout: 20000
- assertVisible:
    id: reset-status-message
